name: gate

on: [push]

jobs:
  gate:
    runs-on: ubuntu-latest
    name: LGD gate (gold-test / license / no-plaintext / manifest)
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          # verdict_drift checks out pinned refs (1bc5340 / 28fe22b / 58c0369) to
          # compare two engines. A depth-1 clone has none of them, and the test
          # would fail on a missing ref rather than on a moved verdict.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      - name: Gate bot (gold test + LICENSE/NOTICE + no plaintext keys + manifest syntax)
        run: python framework/gate_bot.py

      - name: Ecosystem map self-test (13-domain / 11-stage alignment)
        run: python demo1/test_ecosystem.py

      - name: Demo2 five-seat review self-test
        run: python demo2/test_demo2.py

      - name: MCP server smoke (tools list + judge + RBAC deny)
        run: python lgd_engine/mcp_smoke.py

      # Unit-level contract: the three laws (L1/L2/L3), CLI exit-code mapping
      # (2 means REJECT, 64 means usage error), and the RBAC separation. The smoke
      # above proves the wire works; these assertions prove the rules do.
      - name: Unit contract tests (three laws / CLI exit codes / RBAC)
        run: python -m unittest discover -s tests -v

      # The comparison claim, made runnable: 12 probes with fixed expected
      # verdicts, scored twice — once by the judges, once by the naive keyword
      # shortcut. Exits non-zero if the gate misses a single probe.
      - name: Baseline comparison (judges vs naive keyword classifier)
        run: python benchmarks/adversarial_baseline.py

      # "Better" as a number: four shortcuts scored on the same cases and on 846
      # records with a contract field deleted or blanked. --write regenerates; a
      # plain run fails if the committed table has drifted from the engine.
      - name: Baseline scorecard is current (and every shortcut is worse)
        run: python benchmarks/baseline_scorecard.py

      # Same fact, different spelling: lexical variants must not move the
      # verdict, and a boolean written as a string must never read as a
      # permission or as a veto.
      - name: Representation variants do not decide
        run: python benchmarks/representation_sweep.py

      # Every release so far could have flipped a shipped verdict with nobody the
      # wiser: nothing compared two engines. This checks a pinned older ref and the
      # working tree over the same 37 cases. The declared table must reproduce, so a
      # fix that moves somebody else's verdict fails the build until it is declared.
      - name: No shipped verdict moved without being declared
        run: python benchmarks/verdict_drift.py --check

      # The table above is checked after merge. This check runs before it: two
      # branches, each with a clean table, can still combine into a tree that moves
      # a case neither branch declared. The base sha is the PR's own fork point, so
      # the gate sees exactly what this request changes. It reads 0/37 on ordinary
      # work and fails only when a rule change moves a verdict elsewhere.
      - name: A pull request may not move a verdict it did not declare
        if: github.event_name == 'pull_request'
        run: |
          python benchmarks/verdict_drift.py --check-pr \
            --base "${{ github.event.pull_request.base.sha }}"

      # The browser-viewable dossier is generated BY the engine, not hand-written.
      # --check fails if the committed page drifts from what the judges produce
      # right now, so the page cannot claim a verdict the code does not give.
      - name: Judge dossier page is in sync with the engine
        run: python benchmarks/build_demo_page.py --check

      # The docs said these were "enforced in CI"; they were not (S7 red team).
      - name: OpenAPI contract validation (structural)
        run: |
          python -m pip install --quiet pyyaml
          python docs/validate_openapi.py

      # The review's central claim — "the gate fails closed" — is a property, so
      # CI runs it as one: 20 probes, and --selfcheck requires every probe to
      # fail against its own mutant (a probe that cannot fail is a hard error).
      # Runs after PyYAML is installed: two contract probes need it and would
      # otherwise report BLOCKED instead of checking anything.
      - name: Adversarial probes + self-check (each probe must be able to fail)
        run: |
          python -m pip install --quiet pyyaml
          python review/redteam_probe.py --selfcheck

      - name: Security self-tests (injection defence + tree scan)
        run: |
          python security/prompt_injection_defense.py
          python security/security_scan.py

      - name: SSE smoke (generate both event paths, then assert 6/6)
        run: |
          python -m demo2.session --case demo2/case_gate_report.json --auto
          python -m demo2.session --case demo2/case_gate_report_critical.json --auto
          python -m demo2.sse_server --port 8770 --smoke
