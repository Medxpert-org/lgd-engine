name: gate

on: [push]

jobs:
  gate:
    runs-on: ubuntu-latest
    name: LGD gate (gold-test / license / no-plaintext / manifest)
    steps:
      - name: Checkout
        run: git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" .

      - name: Gate bot (gold test + LICENSE/NOTICE + no plaintext keys + manifest syntax)
        run: python3 framework/gate_bot.py

      - name: Demo2 five-seat review self-test
        run: python3 demo2/test_demo2.py

      - name: MCP server smoke (tools list + judge + RBAC deny)
        run: python3 lgd_engine/mcp_smoke.py
