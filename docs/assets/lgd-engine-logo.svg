<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LGD Engine logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A47"/>
      <stop offset="1" stop-color="#0A1D33"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- gate frame: two pillars + top beam -->
  <rect x="136" y="118" width="30" height="276" rx="10" fill="url(#gate)"/>
  <rect x="346" y="118" width="30" height="276" rx="10" fill="url(#gate)"/>
  <rect x="120" y="96" width="272" height="34" rx="12" fill="url(#gate)"/>
  <!-- three gate bars (LGD three laws: registered / evidenced / gated) -->
  <rect x="156" y="196" width="200" height="22" rx="8" fill="#F8FAFC"/>
  <rect x="156" y="256" width="200" height="22" rx="8" fill="#F8FAFC"/>
  <rect x="156" y="316" width="200" height="22" rx="8" fill="#F8FAFC"/>
  <!-- base line -->
  <rect x="176" y="392" width="160" height="10" rx="5" fill="#475E7C"/>
</svg>
